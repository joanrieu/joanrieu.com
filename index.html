<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joan Rieu</title>
    <style>
      html {
        font-family: monospace;
        background: black;
      }

      .wrap {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 2vw;
        width: 100vw;
      }

      .wrap svg {
        width: 45vw;
        height: auto;
        max-width: 480px;
        max-height: 80vh;
      }

      @media (aspect-ratio < 1) {
        .wrap {
          flex-direction: column;
          gap: 4vh;
        }

        .wrap svg {
          width: 80vw;
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <script>
      const art = [
        `_____#________________________
         _____#___####____#####__#####_
         _____#__#____#__#____#__#____#
         #____#__#____#__#____#__#____#
         _####____####____#####__#____#`,
        `####____#___####__#____#
         #___#___#__#______#____#
         ####____#__####___#____#
         #___#___#__#______#____#
         #____#__#___####___####_`,
      ];
      const cell = 10;
      const ns = "http://www.w3.org/2000/svg";
      const pad = cell * 2;
      const wrap = document.createElement("div");
      wrap.className = "wrap";
      wrap.setAttribute("aria-label", "Joan Rieu");
      for (const piece of art) {
        const rows = piece
          .trim()
          .split("\n")
          .map((r) => r.trim());
        const cols = Math.max(...rows.map((r) => r.length));
        const svg = document.createElementNS(ns, "svg");
        svg.setAttribute(
          "viewBox",
          `0 0 ${cols * cell + pad * 2} ${rows.length * cell + pad * 2}`,
        );
        for (let y = 0; y < rows.length; y++) {
          for (let x = 0; x < rows[y].length; x++) {
            if (rows[y][x] === "#") {
              const circle = document.createElementNS(ns, "circle");
              circle.setAttribute("cx", x * cell + cell / 2 + pad);
              circle.setAttribute("cy", y * cell + cell / 2 + pad);
              circle.setAttribute("r", cell / 3);
              circle.setAttribute("fill", "white");
              svg.appendChild(circle);
            }
          }
        }
        wrap.appendChild(svg);
      }
      document.body.appendChild(wrap);
    </script>
  </body>
</html>
