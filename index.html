<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joan Rieu</title>
    <script type="importmap">
      { "imports": { "d3-force": "https://esm.sh/d3-force@3" } }
    </script>
    <style>
      html {
        font-family: monospace;
        background: black;
      }

      .wrap {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 2vw;
        width: 100vw;
      }

      /* layout probes: kept in flow to measure on-screen position/size,
         but invisible and empty so nothing is drawn or clipped here */
      .wrap svg {
        width: 45vw;
        height: auto;
        max-width: 480px;
        max-height: 80vh;
        visibility: hidden;
      }

      @media (aspect-ratio < 1) {
        .wrap {
          flex-direction: column;
          gap: 4vh;
        }

        .wrap svg {
          width: 80vw;
          max-width: none;
        }
      }

      /* single full-screen canvas; 1 viewBox unit = 1 CSS pixel */
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { forceSimulation, forceLink } from "d3-force";

      const art = [
        `_____#________________________
         _____#___####____#####__#####_
         _____#__#____#__#____#__#____#
         #____#__#____#__#____#__#____#
         _####____####____#####__#____#`,
        `####____#___####__#____#
         #___#___#__#______#____#
         ####____#__####___#____#
         #___#___#__#______#____#
         #____#__#___####___####_`,
      ];
      const cell = 10;
      const ns = "http://www.w3.org/2000/svg";
      const pad = cell * 2;
      const linksPerPoint = 3;
      const homeStrength = 0.12; // linear coefficient of the (saturated) home pull near rest; must exceed springStrength so home is the dominant locator
      const homeSat = 30; // px; saturates the home pull for large errors so a wide scatter gathers gracefully instead of yanking
      const springStrength = 0.04; // initial coupling; ramps down to 0 so points end pulled only to their own home (no off-home stall)
      const springFade = 4000; // ms over which the spring strength fades to 0

      const wrap = document.createElement("div");
      wrap.className = "wrap";
      wrap.setAttribute("aria-label", "Joan Rieu");

      // one full-screen overlay holds every circle so dots overshooting their
      // piece's rest area are never clipped by a small per-piece viewBox
      const overlay = document.createElementNS(ns, "svg");
      overlay.setAttribute("class", "overlay");

      const pieces = [];

      const shuffle = (arr) => {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      };

      for (const piece of art) {
        const rows = piece
          .trim()
          .split("\n")
          .map((r) => r.trim());
        const cols = Math.max(...rows.map((r) => r.length));
        const W = cols * cell + pad * 2;
        const H = rows.length * cell + pad * 2;

        // invisible layout probe: same viewBox + CSS sizing as before so its
        // getBoundingClientRect tells us where this piece lands on screen
        const probe = document.createElementNS(ns, "svg");
        probe.setAttribute("viewBox", `0 0 ${W} ${H}`);
        probe.setAttribute("aria-hidden", "true");

        // collect points at their original art positions (piece-local coords).
        // each point IS a d3-force node: d3 will add/manage x,y,vx,vy on it.
        const points = [];
        for (let y = 0; y < rows.length; y++) {
          for (let x = 0; x < rows[y].length; x++) {
            if (rows[y][x] !== "#") continue;
            const px = x * cell + cell / 2 + pad;
            const py = y * cell + cell / 2 + pad;
            const circle = document.createElementNS(ns, "circle");
            circle.setAttribute("fill", "white");
            overlay.appendChild(circle);
            points.push({
              ox: px,
              oy: py,
              x: px,
              y: py,
              vx: 0,
              vy: 0,
              el: circle,
            });
          }
        }

        // attach each point to `linksPerPoint` random peers
        const springs = [];
        const seen = new Set();
        for (let i = 0; i < points.length; i++) {
          const order = points.map((_, j) => j).filter((j) => j !== i);
          shuffle(order);
          let made = 0;
          for (const j of order) {
            if (made >= linksPerPoint) break;
            const key = i < j ? `${i},${j}` : `${j},${i}`;
            if (seen.has(key)) continue;
            seen.add(key);
            made++;
            const a = points[i];
            const b = points[j];
            springs.push({
              source: a,
              target: b,
              L: Math.hypot(b.ox - a.ox, b.oy - a.oy), // rest length (distance-only)
            });
          }
        }

        wrap.appendChild(probe);
        pieces.push({ probe, points, springs, W, H, offsetX: 0, offsetY: 0, scale: 1 });
      }
      document.body.appendChild(wrap);
      document.body.appendChild(overlay);

      const allPoints = pieces.flatMap((p) => p.points);
      const allSprings = pieces.flatMap((p) => p.springs);

      // measure each probe's on-screen rect and derive the piece-local ->
      // screen transform (matches preserveAspectRatio="xMidYMid meet").
      function updateLayout() {
        const iw = window.innerWidth;
        const ih = window.innerHeight;
        overlay.setAttribute("viewBox", `0 0 ${iw} ${ih}`);
        for (const piece of pieces) {
          const r = piece.probe.getBoundingClientRect();
          // meet: content scaled to fit, centered in the CSS box
          const scale = Math.min(r.width / piece.W, r.height / piece.H);
          const contentW = piece.W * scale;
          const contentH = piece.H * scale;
          piece.offsetX = r.left + (r.width - contentW) / 2;
          piece.offsetY = r.top + (r.height - contentH) / 2;
          piece.scale = scale;
          const rr = (cell / 3) * scale;
          for (const p of piece.points) p.el.setAttribute("r", rr);
        }
      }
      window.addEventListener("resize", updateLayout);

      // ---- d3-force simulation ------------------------------------------------
      // One-shot: points start scattered across the screen and converge once
      // to form the word, then stop. forceLink couples point-pairs at their
      // rest length; a saturated custom home pull (constant pull when far so a
      // wide scatter gathers gracefully, linear spring when near so it closes
      // the last px precisely) draws each point to its own slot; a constant
      // drag damps it. d3's timer drives the ticks; we render each and stop
      // when settled.
      const drag = 0.9; // velocity retained per tick; lower = damped sooner

      let startAt = 0; // performance.now() of sim start; drives the spring fade

      const sim = forceSimulation(allPoints).stop();
      sim.velocityDecay(0); // our drag force is the sole velocity damping
      sim.alphaDecay(0); // constant alpha: the sim ticks until we stop it

      sim.force("spring", forceLink(allSprings).distance((l) => l.L).strength(() => springStrength * Math.max(0, 1 - (performance.now() - startAt) / springFade)));
      sim.force("home", () => {
        for (const p of allPoints) {
          // saturate: big error -> ~constant force (no yank); small -> linear
          const ex = (p.ox - p.x) / (1 + Math.abs(p.ox - p.x) / homeSat);
          const ey = (p.oy - p.y) / (1 + Math.abs(p.oy - p.y) / homeSat);
          p.vx += homeStrength * ex;
          p.vy += homeStrength * ey;
        }
      });
      sim.force("drag", () => {
        for (const p of allPoints) {
          p.vx *= drag;
          p.vy *= drag;
        }
      });

      // settled when the worst point is both close to rest and slow.
      function settled() {
        let e = 0;
        let v = 0;
        for (const p of allPoints) {
          e = Math.max(e, Math.abs(p.x - p.ox) + Math.abs(p.y - p.oy));
          v = Math.max(v, Math.abs(p.vx) + Math.abs(p.vy));
        }
        return e < settleErr && v < settleVel;
      }

      // scatter each point to a random screen position (mapped back to its
      // piece-local coords) — the "super spread apart" start.
      function scatter() {
        const iw = window.innerWidth;
        const ih = window.innerHeight;
        for (const piece of pieces) {
          const { offsetX, offsetY, scale } = piece;
          for (const p of piece.points) {
            p.x = (Math.random() * iw - offsetX) / scale;
            p.y = (Math.random() * ih - offsetY) / scale;
            p.vx = 0;
            p.vy = 0;
          }
        }
      }

      // map piece-local coords -> overlay screen coords via each piece's
      // measured transform; radius is scaled too, so rest size is preserved
      function render() {
        for (const piece of pieces) {
          const { offsetX, offsetY, scale } = piece;
          for (const p of piece.points) {
            p.el.setAttribute("cx", offsetX + p.x * scale);
            p.el.setAttribute("cy", offsetY + p.y * scale);
          }
        }
      }

      const settleErr = 0.5; // max point-to-rest error (px) to count as settled
      const settleVel = 0.03; // max point speed (px/frame) to count as settled
      const settleHold = 12; // settled() must hold this many consecutive ticks before stopping, so a momentary reading can't freeze it early
      let settleTicks = 0;

      sim.on("tick", () => {
        render();
        if (settled()) {
          if (++settleTicks >= settleHold) sim.stop();
        } else {
          settleTicks = 0;
        }
      });

      // layout needs one frame after append before rects are reliable
      requestAnimationFrame(() => {
        updateLayout();
        scatter();
        startAt = performance.now();
        sim.restart();
      });
    </script>
  </body>
</html>
