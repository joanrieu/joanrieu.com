<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joan Rieu</title>
    <style>
      html {
        font-family: system-ui;
        background: black;
        color: white;
      }

      h1 {
        margin: 1rem 2rem;
        padding: 0;
        font-size: 2rem;
      }

      svg {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100vw;
        height: auto;
        max-height: 100vh;
        shape-rendering: crispEdges;
      }

      a {
        position: absolute;
        bottom: 1rem;
        right: 2rem;
        font-size: 1.5rem;
        font-weight: bold;
        color: white;
        text-decoration: none;
        transform-origin: right bottom;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.675);
      }

      a:hover {
        transform: scale(1.3);
      }
    </style>
  </head>
  <body>
    <h1>Joan Rieu</h1>
    <a href="https://www.linkedin.com/in/joanrieu/">Hire me &rarr;</a>
    <script>
      const art = `
        _________#______________________________####____#___####__#____#____
        _________#___####____#####__#####_______#___#___#__#______#____#____
        _________#__#____#__#____#__#____#______####____#__####___#____#____
        ____#____#__#____#__#____#__#____#______#___#___#__#______#____#____
        _____####____####____#####__#____#______#____#__#___####___####_____
      `;
      const cell = 10;
      const rows = art
        .trim()
        .split("\n")
        .map((r) => r.trim());
      const cols = Math.max(...rows.map((r) => r.length));
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("aria-label", "Joan Rieu");
      svg.setAttribute("viewBox", `0 0 ${cols * cell} ${rows.length * cell}`);
      for (let y = 0; y < rows.length; y++) {
        for (let x = 0; x < rows[y].length; x++) {
          if (rows[y][x] === "#") {
            const circle = document.createElementNS(ns, "circle");
            circle.setAttribute("cx", x * cell + cell / 2);
            circle.setAttribute("cy", y * cell + cell / 2);
            circle.setAttribute("r", cell / 3);
            circle.setAttribute("fill", "white");
            svg.appendChild(circle);
          }
        }
      }
      document.body.appendChild(svg);
      document.querySelector("h1").remove();
    </script>
  </body>
</html>
