<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joan Rieu</title>
    <script type="importmap">
      { "imports": { "d3": "https://esm.sh/d3@7" } }
    </script>
    <style>
      html {
        font-family: monospace;
        background: black;
      }

      .wrap {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 2vw;
        width: 100vw;
      }

      /* layout probes: kept in flow to measure on-screen position/size,
         but invisible and empty so nothing is drawn or clipped here */
      .wrap svg {
        width: 45vw;
        height: auto;
        max-width: 480px;
        max-height: 80vh;
        visibility: hidden;
      }

      @media (aspect-ratio < 1) {
        .wrap {
          flex-direction: column;
          gap: 4vh;
        }

        .wrap svg {
          width: 80vw;
          max-width: none;
        }
      }

      /* single full-screen canvas; 1 viewBox unit = 1 CSS pixel */
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import * as d3 from "d3";

      const art = [
        `_____#________________________
         _____#___####____#####__#####_
         _____#__#____#__#____#__#____#
         #____#__#____#__#____#__#____#
         _####____####____#####__#____#`,
        `####____#___####__#____#
         #___#___#__#______#____#
         ####____#__####___#____#
         #___#___#__#______#____#
         #____#__#___####___####_`,
      ];
      const cell = 10;
      const pad = cell * 2;
      const linksPerPoint = 3;
      const homeStrength = 0.005; // forceX/forceY Hooke strength toward each point's home; low so a screen-wide scatter doesn't yank (no saturation now)
      const springStrength = 0.003; // initial coupling (fades to 0); kept below homeStrength so home dominates near rest -> no off-home stall
      const springFade = 2500; // ms over which the spring strength fades to 0
      const velocityDecay = 0.05; // d3 velocityDecay: velocity retained = 1 - this; low = bouncy (compensates for the weaker linear pull)
      const settleErr = 0.5; // max point-to-rest error (px) to count as settled
      const settleVel = 0.03; // max point speed (px/frame) to count as settled
      const settleHold = 12; // settled() must hold this many consecutive ticks before stopping, so a momentary reading can't freeze it early
      const fadeIn = 1500; // ms for the dots to fade in over the start of the gather

      const wrap = d3.select("body").attr("aria-label", "Joan Rieu").append("div").attr("class", "wrap");
      // start hidden so the circles (created with no cx/cy yet) never flash
      // at (0,0) before scatter + the first render position them
      const overlay = d3
        .select("body")
        .append("svg")
        .attr("class", "overlay")
        .attr("opacity", 0);

      const pieces = art.map((piece) => {
        const rows = piece
          .trim()
          .split("\n")
          .map((r) => r.trim());
        const cols = d3.max(rows, (r) => r.length);
        const W = cols * cell + pad * 2;
        const H = rows.length * cell + pad * 2;

        // invisible layout probe: same viewBox + CSS sizing so its rect tells
        // us where this piece lands on screen
        const probe = wrap.append("svg").attr("viewBox", `0 0 ${W} ${H}`);

        // collect points at their original art positions (piece-local coords),
        // declaratively via d3.range. Each point IS a d3-force node.
        const points = d3
          .range(rows.length)
          .flatMap((y) =>
            d3
              .range(rows[y].length)
              .filter((x) => rows[y][x] === "#")
              .map((x) => ({
                ox: x * cell + cell / 2 + pad,
                oy: y * cell + cell / 2 + pad,
                x: 0,
                y: 0,
                vx: 0,
                vy: 0,
              })),
          );

        // each point links to `linksPerPoint` random peers — fully
        // declarative via d3.range + d3.shuffle + slice. Duplicate undirected
        // edges (a pair picked from both ends) can occur; forceLink tolerates
        // them (just 2x stiffness on that pair) and they're rare, so no dedup.
        const springs = d3.range(points.length).flatMap((i) =>
          d3
            .shuffle(d3.range(points.length).filter((j) => j !== i))
            .slice(0, linksPerPoint)
            .map((j) => ({
              source: points[i],
              target: points[j],
              L: Math.hypot(points[j].ox - points[i].ox, points[j].oy - points[i].oy),
            })),
        );

        return { probe, points, springs, W, H, offsetX: 0, offsetY: 0, scale: 1 };
      });

      const allPoints = pieces.flatMap((p) => p.points);
      const allSprings = pieces.flatMap((p) => p.springs);

      // nested data-join: one <g> per piece carrying its screen transform,
      // with circles inside in piece-local coords. The transform maps local ->
      // screen, so render updates only cx/cy and resize touches only the
      // transform (no manual offset/scale math, no per-resize radius scaling).
      const pieceG = overlay.selectAll("g").data(pieces).join("g");
      const circles = pieceG
        .selectAll("circle")
        .data((d) => d.points)
        .join("circle")
        .attr("fill", "white")
        .attr("r", cell / 3);

      // measure each probe's on-screen rect and set its group's transform
      // (matches preserveAspectRatio="xMidYMid meet").
      function updateLayout() {
        overlay.attr("viewBox", `0 0 ${window.innerWidth} ${window.innerHeight}`);
        pieceG.each((d) => {
          const r = d.probe.node().getBoundingClientRect();
          d.scale = Math.min(r.width / d.W, r.height / d.H);
          d.offsetX = r.left + (r.width - d.W * d.scale) / 2;
          d.offsetY = r.top + (r.height - d.H * d.scale) / 2;
        });
        pieceG.attr("transform", (d) => `translate(${d.offsetX},${d.offsetY}) scale(${d.scale})`);
      }
      d3.select(window).on("resize", updateLayout);

      // ---- d3-force simulation ------------------------------------------------
      // One-shot: points start scattered across the screen and converge once
      // to form the word, then stop. forceLink couples point-pairs at their
      // rest length (fading to 0); forceX/forceY Hooke-pull each point to its
      // own home; d3's built-in velocityDecay damps it. d3's timer drives the
      // ticks; we render each and stop when settled.
      let startAt = 0; // performance.now() of sim start; drives the spring fade

      const sim = d3.forceSimulation(allPoints).stop();
      sim.velocityDecay(velocityDecay); // built-in damping (replaces a custom drag force)
      sim.alphaDecay(0); // constant alpha: the sim ticks until we stop it

      sim.force(
        "spring",
        d3
          .forceLink(allSprings)
          .distance((l) => l.L)
          .strength(() => springStrength * Math.max(0, 1 - (performance.now() - startAt) / springFade)),
      );
      // home pull via d3 built-ins (no custom force, no loop): linear Hooke
      // toward each point's own home. No saturation, hence the low homeStrength.
      sim.force("homeX", d3.forceX((d) => d.ox).strength(homeStrength));
      sim.force("homeY", d3.forceY((d) => d.oy).strength(homeStrength));

      // settled when the worst point is both close to rest and slow.
      function settled() {
        const e = d3.max(allPoints, (p) => Math.abs(p.x - p.ox) + Math.abs(p.y - p.oy));
        const v = d3.max(allPoints, (p) => Math.abs(p.vx) + Math.abs(p.vy));
        return e < settleErr && v < settleVel;
      }

      // scatter each point to a random screen position (mapped back to its
      // piece-local coords) — the "super spread apart" start. d3 selection.each
      // iterates the bound circles; the piece comes from the parent <g>'s datum.
      function scatter() {
        const iw = window.innerWidth;
        const ih = window.innerHeight;
        circles.each(function (d) {
          const piece = d3.select(this.parentNode).datum();
          d.x = (Math.random() * iw - piece.offsetX) / piece.scale;
          d.y = (Math.random() * ih - piece.offsetY) / piece.scale;
          d.vx = 0;
          d.vy = 0;
        });
      }

      // circles live in piece-local coords under the group transform, so
      // render is just cx/cy.
      function render() {
        circles.attr("cx", (d) => d.x).attr("cy", (d) => d.y);
      }

      let settleTicks = 0;

      sim.on("tick", () => {
        render();
        if (settled()) {
          if (++settleTicks >= settleHold) sim.stop();
        } else {
          settleTicks = 0;
        }
      });

      // layout needs one frame after append before rects are reliable
      requestAnimationFrame(() => {
        updateLayout();
        scatter();
        render(); // position the (still invisible) dots at their scattered spots
        startAt = performance.now();
        // now fade them in over the start of the gather
        overlay.transition().duration(fadeIn).attr("opacity", 1);
        sim.restart();
      });
    </script>
  </body>
</html>
