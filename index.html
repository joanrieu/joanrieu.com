<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joan Rieu</title>
    <style>
      html {
        font-family: monospace;
        background: black;
      }

      svg {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100vw;
        height: auto;
        max-height: 100vh;
      }

      a {
        position: absolute;
        bottom: 1rem;
        right: 2rem;
        font-size: 2rem;
        font-weight: bold;
        color: white;
        text-decoration: none;
        transform-origin: right bottom;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.675);
      }

      a:hover {
        transform: scale(1.3);
      }

      .glow.blink {
        animation: neon-glow 5s ease-in-out 1 both;
      }

      @keyframes neon-glow {
        0% {
          opacity: 0;
        }
        20% {
          opacity: 0.9;
          fill: #0bb7d1;
        }
        50% {
          opacity: 1;
          fill: #0bb7d1;
        }
        80% {
          opacity: 0.8;
          fill: #ee2222;
        }
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <h1>Joan Rieu</h1>
    <a href="https://www.linkedin.com/in/joanrieu/">Hire me &rarr;</a>
    <script>
      const art = `
        _________#______________________________####____#___####__#____#____
        _________#___####____#####__#####_______#___#___#__#______#____#____
        _________#__#____#__#____#__#____#______####____#__####___#____#____
        ____#____#__#____#__#____#__#____#______#___#___#__#______#____#____
        _____####____####____#####__#____#______#____#__#___####___####_____
      `;
      const cell = 10;
      const rows = art
        .trim()
        .split("\n")
        .map((r) => r.trim());
      const cols = Math.max(...rows.map((r) => r.length));
      const ns = "http://www.w3.org/2000/svg";
      const pad = cell * 2;
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("aria-label", "Joan Rieu");
      svg.setAttribute(
        "viewBox",
        `0 0 ${cols * cell + pad * 2} ${rows.length * cell + pad * 2}`,
      );
      const defs = document.createElementNS(ns, "defs");
      const filter = document.createElementNS(ns, "filter");
      filter.setAttribute("id", "glow");
      filter.setAttribute("x", "-100%");
      filter.setAttribute("y", "-100%");
      filter.setAttribute("width", "300%");
      filter.setAttribute("height", "300%");
      const blur = document.createElementNS(ns, "feGaussianBlur");
      blur.setAttribute("stdDeviation", "5");
      filter.appendChild(blur);
      defs.appendChild(filter);
      svg.appendChild(defs);
      const dots = [];
      for (let y = 0; y < rows.length; y++) {
        for (let x = 0; x < rows[y].length; x++) {
          if (rows[y][x] === "#") {
            const glow = document.createElementNS(ns, "circle");
            glow.setAttribute("cx", x * cell + cell / 2 + pad);
            glow.setAttribute("cy", y * cell + cell / 2 + pad);
            glow.setAttribute("r", cell);
            glow.setAttribute("fill", "#0bb7d1");
            glow.setAttribute("opacity", "0");
            glow.setAttribute("class", "glow");
            glow.setAttribute("filter", "url(#glow)");
            svg.appendChild(glow);
            const circle = document.createElementNS(ns, "circle");
            circle.setAttribute("cx", x * cell + cell / 2 + pad);
            circle.setAttribute("cy", y * cell + cell / 2 + pad);
            circle.setAttribute("r", cell / 3);
            circle.setAttribute("fill", "white");
            svg.appendChild(circle);
            dots.push({ el: circle, glow, x, y });
          }
        }
      }
      for (const dot of dots) {
        dot.nearest = dots
          .filter((d) => d !== dot)
          .map((d) => ({ d, dist: (d.x - dot.x) ** 2 + (d.y - dot.y) ** 2 }))
          .sort((a, b) => a.dist - b.dist)
          .map(({ d }) => d);
      }
      document.body.appendChild(svg);
      document.querySelector("h1").remove();

      const ANIM_MS = 150;
      function ignite(dot) {
        if (dot.glow.classList.contains("blink")) return;
        dot.glow.classList.add("blink");
        propagate(dot);
      }
      function propagate(dot) {
        setTimeout(() => {
          const next = dot.nearest.find(
            (d) => !d.glow.classList.contains("blink"),
          );
          if (next) ignite(next);
        }, ANIM_MS);
      }
      ignite(dots[Math.floor(Math.random() * dots.length)]);

      window.addEventListener("animationend", (e) => {
        const dot = dots.find((d) => d.glow === e.target);
        if (dot) {
          e.target.classList.remove("blink");
          propagate(dot);
        }
      });
    </script>
  </body>
</html>
